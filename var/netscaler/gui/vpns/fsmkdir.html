<HTML>
<HEAD>
<META content="text/html;charset=utf-8" http-equiv="Content-Type">
<TITLE></TITLE>
<script type="text/javascript" src="/vpn/resources.js"></script>
<script type="text/javascript" language="javascript">
var Resources = new ResourceManager("/vpn/resources/{lang}", "fsmkdir");
</script>
<style type="text/css">
body
{
  visibility: hidden;
}
</style>
<script language="javascript">
var frmtitle=parent.frames["title"];
var path=frmtitle.activepath;
function ns_checkcreate()
{
if(document.forms['createForm'].name.value=="") {
alert(_("No folder name specified. Please enter a folder name."));
return false;
}
return true;
}
</script>
</HEAD>
<link rel="stylesheet" type="text/css" href="/vpns/images/fs1.css" />

<BODY>
<BR><div align="center">
<TABLE BGCOLOR=#CCCCCC CELLPADDING=2 CELLSPACING=1 BORDER=2>
<TR><TD COLSPAN=2 ALIGN=center class=title>
<B><span id="Create Directory"></span></B></TD></TR>
<TR><TD ALIGN=center>
<FORM ACTION="/fs/mkdir" METHOD="POST" NAME="createForm">
<script language="javascript">
	document.writeln('<INPUT TYPE=HIDDEN NAME=path VALUE="' + decodeURIComponent(path) +'">');
	document.writeln('<INPUT TYPE=HIDDEN NAME=nsc_nonce VALUE="' + parent.parent.nsc_nonce +'">');
</script>
<TABLE BGCOLOR=#CCCCCC CELLPADDING=4 CELLSPACING=2 BORDER=0>
<TR><TD ALIGN=right VALIGN=middle><span id="Under Directory:"></span></TD>
<TD ALIGN=left VALIGN=top>
<script language="javascript">
	document.writeln(frmtitle.NS_url2html(path));
</script>
</TD></TR>
<TR><TD ALIGN=right VALIGN=middle><span id="New Folder:"></span></TD>
<TD ALIGN=left VALIGN=top>
<INPUT TYPE="text" NAME=name>
</TD></TR>
<TR><TD ALIGN=middle colspan=2>
<INPUT ID=Button_Create TYPE=SUBMIT NAME="Create" onclick="javascript:return ns_checkcreate();" VALUE="" STYLE="width:100px;height:24px;" class=button>
<INPUT ID=Button_Cancel TYPE=button VALUE="" onclick="frmtitle.NS_cancelAction();" STYLE="width:100px;height:24px;" class=button></TD></TR>
</TABLE>
</FORM>
</TD> 
</TR>
</TABLE>
</div>
<script type="text/javascript" language="javascript">
Resources.Load();
</script>
</BODY>
</HTML>
