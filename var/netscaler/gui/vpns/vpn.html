<SCRIPT language="javascript" >
// set showProxyConfigPrompt to "false" in the next line if you want to suppress the prompt to configure proxy
var showProxyConfigPrompt = "true";

var browserName = navigator.appName;
var nscookies=document.cookie;
var NameOfClientCookie = "NSC_PLUGINC";
var AAACCookieName="NSC_AAAC";
var loggedOut = 0;
var duplicateApplet = false;
var appletLoadSuccessful = false;

//Check if JRE exists on the client machine
function checkJREInstalled(){
	var isJREInstalled = true;
	//If the browser if MSIE
	if(browserName.indexOf("Microsoft Internet Explorer") != -1)
	{
		var applet = document.NSApplet;
		if(applet == null)
		{
			isJREInstalled = false;
		}
	}else{
		//Non-IE browser
		//MSIE always returns TRUE for navigator.javaEnabled() hence we need to separately check for it
		isJREInstalled= window.navigator.javaEnabled();
	}

	if(isJREInstalled == false){
		alert("JRE is not installed on your machine. Install JRE and retry.");
		logoutClientSide();
	}
}

function launchNewWindow(win){
	newWindow = open(win,"", "toolbar=yes,scrollbars=true,resizable=yes,menubar=yes,titlebar=yes");
}

//Sets the 'appletLoadSuccessful' flag to indicate that the applet has been successfully initialized
function setAppletLoadSuccessfulTrue(){
	appletLoadSuccessful = true;
}

//Sets the 'duplicateApplet' flag to indicate that another instance of the applet is attempting to load
function setDuplicateAppletTrue(){
	duplicateApplet = true;
}


function logoutClientSide(){
	//TODO: the following two lines are commented as they are not working correctly on Safari browser
	ns_removeCookie();
	document.cookie = NameOfClientCookie + '=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/';
	self.close(); //will raise "onUnload" event
}

function showServicesPage() {
	window.setTimeout( showServicesPageAfterDelay, 1000 );
}

function showServicesPageAfterDelay()
{
	var svcref = window.opener.location.href;
	var indexColon = svcref.indexOf(':');
	var indexJSvc = svcref.indexOf("/j_services.html");

	if(indexColon == -1) return;
	if((indexJSvc == -1) || (indexJSvc < indexColon)) return;
	var httpUrl = "http" + svcref.substring(indexColon,indexJSvc) + "/services.html";
	window.opener.location.replace(httpUrl);
}


function showServicesPageHTTPS()
{
	window.opener.location.replace("/vpns/services.html");
}


function ns_removeCookie()
{
   document.cookie = AAACCookieName + '=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/';
}


//Called on onUnload event i.e. when the applet window is being closed (or refershed or redirected)
function onAppletWindowClose(){
	//If duplicate applet then close window without doing anything
	if (duplicateApplet == true){
		return;
	}
	ns_removeCookie();
	document.cookie = NameOfClientCookie + '=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/';
	//Check if the user has clicked the 'Close' button on the applet window without logging out
	//Logout method is called only if the applet has been loaded successfully. As the onAppletWindowClose() method is called whenever
	//the applet window is being closed we need to make this check.
	if(loggedOut == 0 && appletLoadSuccessful == true){
		document.NSApplet.logout(false, false); //logout(boolean logoutDueToError, boolean askForConfirmation)
	}
	return;
}


//Called by applet when logging out.
function closeAppletWindow(){
	loggedOut = 1;
	self.close(); //Will raise "onUnload" event
}

//This function is not supported only on Opera (Version lower than 11) 
window.onbeforeunload = onAppletWindowClose;

</SCRIPT>
