<h1 class="topictitle1">Access Gateway Plug-in System Requirements</h1>
<div><p>The Access Gateway Plug-in runs on the following operating
systems:</p>
<ul><li>Windows XP (32-bit)</li>
<li>Windows Vista (32-bit and 64-bit)</li>
<li>Windows 7 (32-bit and 64-bit)</li>
</ul>
<p>The following Web browsers are supported:</p>
<ul><li> Internet Explorer</li>
<li>Firefox</li>
</ul>
