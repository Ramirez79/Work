<h1 class="topictitle1">Access Gateway Session Error Codes</h1>
<div><p>During your Access Gateway session, information is logged regarding the session.  The logs contain error codes that you can provide to your Help desk personnel or system administrator if you are experiencing difficulties with your session or connection.</p>
