<h1 class="topictitle1">接続ログの表示</h1>
<div>
<div class="section">Access Gateway Plug-inの接続ログには、Access Gatewayおよびネットワークリソースへの接続の詳細が記録されます。 このログは接続上の問題のトラブルシューティングに役立ちます。 ログをヘルプデスクのサポート担当者またはシステム担当者に送ることができます。</div>
<ol>
<li><span>通知領域のAccess Gatewayアイコンを右クリックします。</span></li>
<li><span><span class="uicontrol">［接続ログを表示］</span>を選択します。</span></li>
</ol>
