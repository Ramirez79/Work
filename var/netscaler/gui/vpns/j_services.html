<script language="JavaScript" type="text/javascript">
var ispluginrunning=0;
var NameOfClientCookie="NSC_PLUGINC";
var childAppletWindow = null;

function ns_checksystem()
{
	if(document.cookie.length > 0) {
		begin=document.cookie.indexOf(NameOfClientCookie+"=1");
		if(begin!=-1) {
			ispluginrunning=1;
			return; 
		}
   }
}

function ns_loadsessionwindow(is_manual)
{
	ns_checksystem();

	//for manual window opening don't respect cookie
	if(is_manual) {
		if( childAppletWindow!=null && !childAppletWindow.closed ) {
			return;
		}
	}
	else {
		// if plugin is running and not closed, don't create another one
		if( (ispluginrunning!=0) || (childAppletWindow!=null && !childAppletWindow.closed)) {
			return;
		}
	}
	
	var winx = screen.width-400; 
	var winy = screen.height-175-60;
	
	childAppletWindow = window.open("/vpns/vpn.html", "_blank", "toolbar=no,menubar=no,status=no,width=375,height=200,resizable=no,left="+winx+",top="+winy);
	
	//Check if the pop-up was blocked by some pop-up blocker
	try{
		if (childAppletWindow==null || typeof(childAppletWindow)=="undefined" || childAppletWindow.closed) {
			return;
		}
	}
	catch(ex){
		return;
	}
	
	childAppletWindow.opener = self;
	ispluginrunning=1;
}

</SCRIPT>
</head>
