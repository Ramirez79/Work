        <script type="text/javascript">
            // Form provider for demo purposes - loads form data from script elements within the page
            var exampleFormProvider = function (url, formData, headers, callback) {
                var scriptId = url.substring(url.indexOf('#'), url.length),
                    $scriptElement = $(scriptId),
                    formXml = $.parseXML($.trim($scriptElement.text())),
                    formProtocolName = $scriptElement.data('protocolname');

                callback(formXml, formProtocolName);
            };

            $(document).ready(function() {
                // A real application may decide to display some progress UI here, while it initializes

                showLogonUI();
            });
            
            function showLogonUI() {
                var initialUrl = '#initial-logon-form', // Fake URL of initial logon form, for the sake of example
                    $authenticationPane = $('#authentication'),
                    $widgetContainer = $('#logonbox-logonform'),
                    logonboxContainerTop = parseFloat($("#logonbox-container").css("top")) || 0,
                    logonbeltTopshadow = parseFloat($("#logonbelt-topshadow").css("paddingBottom")) || 0,
                    logonbeltBottomshadow = parseFloat($("#logonbelt-bottomshadow").css("paddingBottom")) || 0;

                // Create the forms authentication widget, attaching it to a page element
                // See LogonUI.html for full description of all the parameters to this widget
                $widgetContainer.ctxsFormsAuthentication({
                    allowCancel: false,

                    authenticationSuccess: function (event, authenticationInfo) {
                        var isPasswordChangeAllowed = authenticationInfo.isPasswordChangeAllowed,
                            isPasswordExpiryNotificationEnabled = authenticationInfo.isPasswordExpiryNotificationEnabled,
                            timeUntilExpiry = authenticationInfo.passwordExpiryTime;

                        // Transition to the password expiry notification if appropriate
                        if (isPasswordChangeAllowed && isPasswordExpiryNotificationEnabled) {
                            showPasswordExpiryNotification(timeUntilExpiry);
                        }
                    },

                    beforeDisplayForm: function () {
                        $authenticationPane.show();
                    },

                    formProvider: exampleFormProvider,

                    // Reserved space is used to calculate space available for control, if space available is less than needed then scrollbar is presented on screen.
                    reservedSpace: logonboxContainerTop + logonbeltTopshadow + logonbeltBottomshadow
                });

                // Start the logon process, passing the URL from which to obtain the initial form
                $widgetContainer.ctxsFormsAuthentication('startAuthentication', initialUrl);

                // On window resize event plug-in will fire its resize event to find out if it need scrollbar.
                $(window).resize(function () {
                    if ($widgetContainer.data('ctxsCtxsFormsAuthentication')) {
                        $widgetContainer.ctxsFormsAuthentication('resize');
                    }
                });
            }

            function showPasswordExpiryNotification(timeUntilExpiry) {
                var $authenticationPane = $('#authentication'),
                    $credentialUpdatePane = $('#credentialupdate'),
                    $widgetContainer = $('#credentialupdate-form');

                // Create the password expiry notification widget in the credential update pane
                $widgetContainer.ctxsPasswordExpiryNotification({
                    // URL of image to use as spinner when a button is pressed
                    formActionSpinnerImageUrl: 'media/Loader.gif',

                    // A function which is responsible for providing localized strings for given string IDs
                    // A real application would use this as an interface to its localization code
                    // This simple implementation demonstrates the string IDs that the widget expects, with example text
                    stringProvider: function(stringId) {
                        var strings = {                            
                            PasswordExpiryNotificationTitle: 'Do you want to change your password?',
                            PasswordExpiryNotificationText: 'Your password will expire in {0} {1}.',
                            PasswordExpiryNotificationTextForToday: 'Your password will expire today.',
                            PasswordExpiryNotificationTextSuffixSingleDay: 'day',
                            PasswordExpiryNotificationTextSuffixMultiDays: 'days',
                            PasswordExpiryNotificationOkButtonText: 'Change Now',
                            PasswordExpiryNotificationCancelButtonText: 'Not Now'
                        };
                        return strings[stringId];
                    },
                    
                    // The action to complete if the user chooses to change their password
                    notificationAccept: function () {
                        showChangePasswordUI();
                    },
                    
                    // The action to complete if the user chooses to dismiss the notification
                    notificationCancel: function () {
                        window.alert('User dismissed the notification.');
                        $credentialUpdatePane.hide();
                    }
                });

                // Prepare the UI
                $authenticationPane.hide();
                $credentialUpdatePane.show();
                
                // Display the notification
                $widgetContainer.ctxsPasswordExpiryNotification('showPasswordExpiryNotification', timeUntilExpiry);
            }
            
            function showChangePasswordUI() {
                var initialUrl = '#change-password-form',
                    $credentialUpdatePane = $('#credentialupdate'),
                    $widgetContainer = $('#credentialupdate-form');
                
                // Create a second instance of the forms authentication widget to handle the user's request to change password.
                // This widget is attached to the same UI element as the password expiry notification and will overwrite that UI.
                $widgetContainer.ctxsFormsAuthentication({
                    // Allow cancel this time since the password change is voluntary.
                    allowCancel: true,
                    
                    authenticationSuccess: function () {
                        $credentialUpdatePane.hide();
                    },
                    
                    authenticationCancel: function (event, authResult) {
                        var authenticationResponse = authResult.authenticationResponse;
                        window.alert('User cancelled the change password operation.');
                        $credentialUpdatePane.hide();
                    },
                    
                    formProvider: exampleFormProvider
                });

                // Start the change password process, passing the URL from which to obtain the initial form
                $widgetContainer.ctxsFormsAuthentication('startAuthentication', initialUrl);
            }
        </script>

                    </Credential>
                    <Label>
                      <Text>Old password:</Text>
                      <Type>plain</Type>
                    </Label>
                    <Input>
                      <Text>
                        <Secret>true</Secret>
                        <ReadOnly>false</ReadOnly>
                        <InitialValue></InitialValue>
                        <Constraint>.+</Constraint>
                      </Text>
                    </Input>
                  </Requirement>
                  <Requirement>
                    <Credential>
                      <ID>newPassword</ID>
                      <SaveID>ExplicitForms-Password</SaveID>
                      <Type>newpassword</Type>
                    </Credential>
                    <Label>
                      <Text>New password:</Text>
                      <Type>plain</Type>
                    </Label>
                    <Input>
                      <Text>
                        <Secret>true</Secret>
                        <ReadOnly>false</ReadOnly>
                        <InitialValue></InitialValue>
                        <Constraint>.+</Constraint>
                      </Text>
                    </Input>
                  </Requirement>
                  <Requirement>
                    <Credential>
                      <ID>confirmPassword</ID>
                      <Type>newpassword</Type>
                    </Credential>
                    <Label>
                      <Text>Confirm password:</Text>
                      <Type>plain</Type>
                    </Label>
                    <Input>
                      <Text>
                        <Secret>true</Secret>
                        <ReadOnly>false</ReadOnly>
                        <InitialValue></InitialValue>
                        <Constraint>.+</Constraint>
                      </Text>
                    </Input>
                  </Requirement>
                  <Requirement>
                    <Credential>
                      <Type>none</Type>
                    </Credential>
                    <Label>
                      <HighlightFields>
                        <CredentialID>newPassword</CredentialID>
                        <CredentialID>confirmPassword</CredentialID>
                      </HighlightFields>
                      <Text>Your new password must meet complexity requirements</Text>
                      <Type>error</Type>
                    </Label>
                    <Input />
                  </Requirement>
                  <Requirement>
                    <Credential>
                      <ID>changePasswordBtn</ID>
                      <Type>none</Type>
                    </Credential>
                    <Label>
                      <Type>none</Type>
                    </Label>
                    <Input>
                      <Button>OK</Button>
                    </Input>
                  </Requirement>
                </Requirements>
              </AuthenticationRequirements>
            </AuthenticateResponse>
        </script>
        
        <!-- Confirmation of successful password change -->
        <script type="text/xml" id="change-password-confirmation" data-protocolname="ExplicitForms">
            <AuthenticateResponse xmlns="http://citrix.com/authentication/response/1">
              <Status>success</Status>
              <Result>more-info</Result>
              <StateContext />
              <AuthenticationRequirements>
                <PostBack>#authentication-success</PostBack>
                <CancelPostBack>#cancel-change-password</CancelPostBack>
                <Requirements>
                  <Requirement>
                    <Credential>
                      <Type>none</Type>
                    </Credential>
                    <Label>
                      <Text>Your password has been changed successfully.</Text>
                      <Type>confirmation</Type>
                    </Label>
                    <Input />
                  </Requirement>
                  <Requirement>
                    <Credential>
                      <ID>changePasswordConfirmBtn</ID>
                      <Type>none</Type>
                    </Credential>
                    <Label>
                      <Type>none</Type>
                    </Label>
                    <Input>
                      <Button>OK</Button>
                    </Input>
                  </Requirement>
                </Requirements>
              </AuthenticationRequirements>
            </AuthenticateResponse>
        </script>
</body>
</html>
