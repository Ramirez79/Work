export NETSCALER=`cat /var/run/.NETSCALER 2>/dev/null`
export NSCONFIG=`cat /var/run/.NSCONFIG 2>/dev/null`
export NSVERSION=`cat /var/run/.NSVERSION 2>/dev/null`
export NSKERNEL=`cat /var/run/.NSKERNEL 2>/dev/null`
NSCONFIG=${NSCONFIG:-/nsconfig}
NSVERSION=${NSVERSION:-""}
NSKERNEL=${NSKERNEL:-/kernel}

NSLOG_FS="var"
export NSLOG_DIR="/$NSLOG_FS/nslog"
export NSPROFLOG_DIR="/$NSLOG_FS/nsproflog"
export NSTRACE_DIR="/$NSLOG_FS/nstrace"
export NSPID_DIR="/var/run"
export NSINSTALL_DIR="/$NSLOG_FS/nsinstall"
export NSLOG="${NSLOG_DIR}/ns.log"
export NSLOG_FILE="newnslog"
export NSPROFLOG_FILE="newproflog"
export NSMONUSERSCRIPTDIR="${NSCONFIG}/monitors"
export NSMONUSERMODULEDIR="${NSMONUSERSCRIPTDIR}/perl_mod/Netscaler"
export NSDNSSEC_DIR="${NSCONFIG}/dns"
export NSNSGC_VDIR=/netscaler/ns_gui/vpn/scripts/linux
export NSNSGC_PDIR=/var/netscaler/gui/vpn/scripts/linux
export NSNSGC_SCRIPTS_VDIR=/netscaler/ns_gui/vpn/scripts
export NSNSGC_SCRIPTS_PDIR=/var/netscaler/gui/vpn/scripts
NSLOG_MAX_SIZE=1500 # kBytes
NSLOG_OPTIONS=

NSSTOPLIST="$NSPID_DIR/ns.stoplist"
NSKILLLIST="$NSPID_DIR/ns.killlist"

SAVECORE=/sbin/savecore
TR=/usr/bin/tr
CHMOD=/bin/chmod
GREP=/usr/bin/grep
MV=/bin/mv
RM=/bin/rm
DU=/usr/bin/du
DF=/bin/df
TOUCH=/usr/bin/touch
TAIL=/usr/bin/tail
HEAD=/usr/bin/head
EXPR=/bin/expr
CAT=/bin/cat
KILL=/bin/kill
KILLALL=/usr/bin/killall
NICE=/usr/bin/nice
GZIP=/usr/bin/gzip
LS=/bin/ls
MOUNT=/sbin/mount

NSAPIMGR=$NETSCALER/nsapimgr

[ ! -d ${NSLOG_DIR} ] && export NSLOG=/dev/console
[ -r $NSCONFIG/netscaler.conf.local ] && . $NSCONFIG/netscaler.conf.local

check_ns()
{
	$NETSCALER/nsapimgr -c
	if [ $? -eq 5 ]
	then
		echo "$1: NetScaler is not running"
		exit 5
	fi
}
