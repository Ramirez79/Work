<script language="JavaScript" type="text/javascript">
  //var nsloc=document.location.href;
  nsloc = document.location.protocol + "//" + document.location.host;
  if(document.location.port != "") {
	  nsloc=nsloc+":"+document.location.port;
  }
  var cookie=document.cookie;
  var ns_aaac="";
  var NameOfCookie="NSC_AAAC";
  var timerID=0;
  var probeErrors=0;
  var agentPort=3148;
  var image;
  var postEPACookie="NSC_EPAFALLBACK";
  var ns_postepa="";
  var npobj;

  if(cookie.length > 0) {
  begin=cookie.indexOf(NameOfCookie+"=");
  if(begin!=-1) {
  begin+=NameOfCookie.length+1;
  end=cookie.indexOf(";", begin);
  if(end==-1) end=cookie.length;
  ns_aaac=decodeURIComponent(cookie.substring(begin, end));
  }
  begin=cookie.indexOf(postEPACookie+"=");
  if(begin!=-1) {
  begin+=postEPACookie.length+1;
  end=cookie.indexOf(";", begin);
  if(end==-1) end=cookie.length;
  ns_postepa=decodeURIComponent(cookie.substring(begin, end));
  if(ns_postepa) nsloc = nsloc + "\/postepa.html";
  }
  }

  function UnsetCookie(cookieName) {
  document.cookie=cookieName+"=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/";
  }

function readCookie(name) {
	var nameEQ = name + "=";
	var ca = document.cookie.split(';');
	for(var i=0;i < ca.length;i++) {
		var c = ca[i];
		while (c.charAt(0)==' ') c = c.substring(1,c.length);
		if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
	}
	return null;
}	

function onAbort(evt){
	//console.log("onabort");
	//console.log(this.height);
  if(this.height==2) {
  UnsetCookie("NSC_AAAC");
  UnsetCookie("NSC_USER");
  UnsetCookie("NSC_EPAC");
  UnsetCookie("NSC_VPNERR");
  UnsetCookie("NSC_EPAFALLBACK");
  window.location="/";
  }
  else {
  window.location = "http://" + document.location.host + ":8080/vpns/services.html";
  }
  }

function loginSuccess(evt){
	//console.log("loginsuccess");
	//console.log(this.height);
  if(this.height==2) {
  UnsetCookie("NSC_AAAC");
  UnsetCookie("NSC_USER");
  UnsetCookie("NSC_EPAC");
  UnsetCookie("NSC_VPNERR");
  UnsetCookie("NSC_EPAFALLBACK");
  window.location="/";
  }
  else {
	  if(timerID) window.clearTimeout(timerID);
	  //window.location = "http://" + "localvip.citrix" + ":8080/vpns/services.html";
  window.location = "/vpns/services.html";
  }
  }

  function nextAgentPort() {
  agentPort = agentPort + 1;
  if( agentPort > 3153 )
  agentPort = 3148;
  }
  
function checkIfAgentReady(){
	if((navigator.userAgent.indexOf("Chrome") > -1) && (navigator.vendor == "Google Inc."))
	{
		console.log("Chrome browser, handling it the new way");
		setTimeout("checkIfInstalledAndDoLogin()",2500);
	}
	else {
		try{
			if(timerID) window.clearTimeout(timerID);
			navigator.plugins.refresh(false);
			var npagee;
			npagee = navigator.mimeTypes["application/x-vpnd"];
			if(npagee){
				var ret;
				var url;
				var d = document.getElementById("scriptArea");
				d.innerHTML = '<OBJECT id="npobj" type="application/x-vpnd" height="0" width="0"></OBJECT>' ;
				npobj = document.getElementById("npobj");
				url = document.location.protocol + "//" + document.location.host;
				if(document.location.port != "") {
					url=url+":"+document.location.port;
				}
				ret = npobj.startvpnd(ns_aaac, url);
				if( ret == "success" ){
					window.setTimeout( "probeAgent()", 2000 );
				}
				else{
					//Agent is installed but not ready, display download button and wait for  agent to be ready
					displayDownloadArea();
					timerID = window.setTimeout( "checkIfAgentReady()", 10000 );
				}
				return;
			}
			else{
				//Agent is not yet installed (or not available with plugin), display download button and wait user to install it.
				//AG will automatically be launched after install
				displayDownloadArea();
				probeAgent();
			}
		}
		catch (err){
			try {
				console.log(err);
			} 
			catch(err) {
				//TODO
			}
			if( npobj ){
				// AG plugin exists, but does not have new IsAgentReady interface, simply do a delayed
				// probe agent and let it auto-upgrade. If agent is not running, user must start it.
				displayDownloadArea();
				probeAgent();
			}
			else{
				//Agent is not yet installed, display download button and wait for  agent to be ready
				if(timerID) window.clearTimeout(timerID);
				displayDownloadArea();
				timerID = window.setTimeout( "checkIfAgentReady()", 10000 );
			}
		}
	}
}

function changelink(type) {
	var arch = navigator.platform;
	switch(type) {
		case 'debian':
			if(arch.indexOf("i686") >= 0) {
				//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient32.deb";
				document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller32.deb";
			}
			else if(arch.indexOf("x86_64") >= 0) {
				//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient64.deb";
				document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller64.deb";
			}
			break;

		case 'rpm':
			if(arch.indexOf("i686") >= 0) {
				//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient32.deb";
				document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller32.rpm";
			}
			else if(arch.indexOf("x86_64") >= 0) {
				//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient64.deb";
				document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller64.rpm";
			}
			break;
		default:
			break;
	}
}

		}
		else if(arch.indexOf("x86_64") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient64.deb";

		}
	} else if(ostype.indexOf("SUSE") >= 0) {
		if(arch.indexOf("i686") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient32.deb";
			document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller32.rpm";
		}
		else if(arch.indexOf("x86_64") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient64.deb";
			document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller64.rpm";
		}
	} else if(ostype.indexOf("Redhat") >= 0) {
		if(arch.indexOf("i686") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient32.deb";
			document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller32.rpm";
		}
		else if(arch.indexOf("x86_64") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient64.deb";
			document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller64.rpm";
		}
	} else {
		if(arch.indexOf("i686") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient32.deb";
			document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller32.deb";
		}
		else if(arch.indexOf("x86_64") >= 0) {
			//document.getElementById("downloadlink").href="/vpn/scripts/linux/nsgclient64.deb";
			document.getElementById("downloadlink").href="/vpn/scripts/linux/nsginstaller64.deb";
		}

	}
	document.getElementById("downloadArea").style.display = '';
}

function probeAgent() {
	//console.log("probeagent");
  if(ns_aaac=="") return;
  if(timerID) window.clearTimeout(timerID);
  image = new Image();
  image.onload = loginSuccess;
  image.onerror = probeError;
  //image.onabort = onAbort; //similar to loginSuccess
  image.src = "http://localhost:"+agentPort+"/svc?NSC_AAAC="+ns_aaac+"&nsloc="+nsloc+"&nsversion=1,1,1,1&nstrace=DEBUG&nsvip=255.255.255.255";
  timerID = window.setTimeout( "probeTimeout()", 3000 );
}

function oldprobeError() {
		//console.log("probeerror");
        if(timerID) window.clearTimeout(timerID);
        probeErrors++;
        if( probeErrors > 20 ) {
            window.location.reload(true);
            return;
        }
        nextAgentPort();
        window.setTimeout( "probeAgent()", 500 );
}

function probeTimeout() {
		//console.log("probetimeout");
        nextAgentPort();
        if(timerID) {
                window.clearTimeout(timerID);
                //if(navigator.userAgent.indexOf("Opera") > 0) window.location.reload (true);
        }
        probeAgent();
}
function checkIfInstalledAndDoLogin()
{
	if(ns_aaac=="")
		return;
	if(timerID)
		window.clearTimeout(timerID);

	image = new Image();
	image.onload = loginSuccess;
	image.onerror = probeError;
	image.src = "http://localhost:"+agentPort+"/svc?NSC_AAAC="+ns_aaac+"&nsloc="+nsloc+"&nsversion=11,0,49,205&nstrace=DEBUG&nsvip=255.255.255.255";
	timerID = window.setTimeout( "probeTimeout()", 3000 );
}

function probeError() {
	if((navigator.userAgent.indexOf("Chrome") > -1) && (navigator.vendor == "Google Inc."))
	{
	if(timerID) window.clearTimeout(timerID);
	probeErrors++;
	//Open NG-VPN app using custom url scheme
	if((probeErrors % 5) == 0 ) {
		window.location = "application://NSGClient";
	}	
	if( probeErrors > 20 ) {
		displayDownloadArea();
	}
	nextAgentPort();
	window.setTimeout( "probeAgent()", 1000 );
	} else {
		oldprobeError();
	}
}
