<script language="JavaScript" type="text/javascript">
function isXpOrHigher() {
	
	var userAgentParts = navigator.userAgent.split("Windows NT ")
	if(userAgentParts.length < 2)		// userAgent doesn't have "Windows NT "
		return false

	return (parseFloat(userAgentParts[1]) > 5.0 ) 	// XP's vesrion number is 5.1. So allow XP or any OS higher than XP
}

var nsloc=document.location.href;
var cookie=document.cookie;
var ns_aaac="";
var NameOfCookie="NSC_AAAC";
var timerID=0;
var probeErrors=0;
var agentPort=3148;
var image;

if(cookie.length > 0) {
   begin=cookie.indexOf(NameOfCookie+"=");
   if(begin!=-1) {
        begin+=NameOfCookie.length+1;
        end=cookie.indexOf(";", begin);
        if(end==-1) end=cookie.length;
        ns_aaac=decodeURIComponent(cookie.substring(begin, end));
   }
}

function UnsetCookie(cookieName) {
document.cookie=cookieName+"=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/";
}

function loginSuccess(evt){
	if(timerID) 
		window.clearTimeout(timerID);
		
        window.location = "/vpns/services.html";
}

function nextAgentPort() {
        agentPort = agentPort + 1;
        if( agentPort > 3150 )
            agentPort = 3148;
}       

function probeAgent() {
	if(isXpOrHigher()) {
		// auto redirect to f_ndisagent.html so that user doesn't need to click twice
		window.location = "/vpns/f_ndisagent.html";		
	}

	if(navigator.userAgent.indexOf("PPC")==-1)
		return;
		
	if(ns_aaac=="") 
		return;
	
	if(timerID) 
		window.clearTimeout(timerID);

        image = new Image();
        image.onload = loginSuccess;
        image.onerror = probeError;
        image.src = "http://localhost:"+agentPort+"/svc?NSC_AAAC="+ns_aaac+"&nsloc="+nsloc+"&nsversion=11,1,47,14&nstrace=DEBUG&nsvip=255.255.255.255&nstdi=ON";
        timerID = window.setTimeout( "probeTimeout()", 3000 );
}

function probeError() {
        if(timerID) window.clearTimeout(timerID);
        probeErrors++;
        if( probeErrors > 20 ) {
            window.location.reload(true);
            return;
        }
        nextAgentPort();
        window.setTimeout( "probeAgent()", 500 );
}

function probeTimeout() {
        if(timerID) {
                window.clearTimeout(timerID);
		if(navigator.userAgent.indexOf("Opera") > 0) 
			window.location.reload (true);
        }
        nextAgentPort();
        probeAgent();
}

function nsexit(){
}
