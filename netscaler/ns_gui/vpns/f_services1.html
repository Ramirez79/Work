<script language="JavaScript" type="text/javascript">
var ispluginrunning=0;
var NameOfClientCookie="NSC_PLUGINC";

function ns_checksystem()
{
   if(document.cookie.length > 0) {
	begin=document.cookie.indexOf(NameOfClientCookie+"=");
	if(begin!=-1) {
		ispluginrunning=1;
		return; 
	}
   }
}

function ns_loadsessionwindow()
{
ns_checksystem();
if(ispluginrunning!=0) return;
if( (navigator.userAgent.indexOf("Windows NT 5.1")!=-1) || //XP
	(navigator.userAgent.indexOf("Windows NT 5.2") != -1 && navigator.userAgent.indexOf("WOW64") == -1) || // Server 2003
	(navigator.userAgent.indexOf("PPC")!=-1) ) {
var winx=screen.width-300; 
var winy=screen.height-160-60;
window.open("/vpns/app.html", "ns_sslvpn", "toolbar=no,menubar=no,status=no,width=300,height=160,resizable=no,left="+winx+",top="+winy);
}
}

function ns_closewindow()
{
if( (navigator.userAgent.indexOf("Windows NT 5.1")!=-1) || //XP
	(navigator.userAgent.indexOf("Windows NT 5.2") != -1 && navigator.userAgent.indexOf("WOW64") == -1) ) {  // Server 2003
	if (location.protocol == "http:") { 
		document.cookie = "NSC_HTTPVSERVER=1; path=/";
	}
	//for XP, and Server 2003 use port 8080
	window.location.reload("http://" + window.location.hostname + ":8080/vpns/services.html");
}
else {	
	window.location.reload("/vpns/services.html");
}
}


function ns_redirectlogin()
{
	window.location.reload("/vpn/index.html");
}
</script>
