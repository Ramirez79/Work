<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Strict//EN" >
<HTML>
	<HEAD>
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
        <META http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>NetScaler Gateway</title>
		<link rel="SHORTCUT ICON" href="/vpn/images/AccessGateway.ico" type="image/vnd.microsoft.icon">
		<link href="/vpn/js/rdx/core/css/rdx.css" id="rdx_css" rel="stylesheet" type="text/css"/>
		<link href="/logon/themes/Default/css/base.css" rel="stylesheet" type="text/css" media="screen" />
		<link rel="stylesheet" href="/logon/fonts/citrix-fonts.css" type="text/css">
		<link href="/logon/themes/Default/css/custom.css" rel="stylesheet" type="text/css" media="screen" />
		<script type="text/javascript" src="/vpn/js/rdx.js"></script>
		<script type="text/javascript" src="/vpn/js/views.js"></script>
		<script type="text/javascript" src="/vpn/js/logout_view.js"></script>
        <script type="text/javascript" src="/vpn/resources.js"></script>
        <script type="text/javascript" language="javascript">
        var Resources = new ResourceManager("/logon/themes/Default/resources/{lang}", "logout");
        </script>
        <style type="text/css">
        body
        {
        visibility: hidden;
        }
        </style>
	<script language="javascript" type="text/javascript" src="/vpn/nsshare.js"></script>

	<script language="JavaScript">
	
	setTimeout(function(){ checkLoad() }, 15000);
	var cssLoaded = 0;
	
	function checkLoad(){
		if(document.readyState !== "complete")
			location.reload();
		
		try {
		  if ( document.getElementById("rdx_css").sheet && document.getElementById("rdx_css").sheet.cssRules.length > 0 )
			cssLoaded = 1;
		  else if ( document.getElementById("rdx_css").styleSheet && document.getElementById("rdx_css").styleSheet.cssText.length > 0 )
			cssLoaded = 1;
		  else if ( document.getElementById("rdx_css").innerHTML && document.getElementById("rdx_css").innerHTML.length > 0 )
			cssLoaded = 1;
		}
		catch(err){ alert("Resources not loaded. Please reload the page.");}
		
		if(!cssLoaded)
			location.reload();
	}
	function GoToLogonPage()
	{
	 	window.location.pathname = "/vpn/index.html";
	}

	function OnPageLoad()
	{
	    try
	    {		
			document.execCommand("ClearAuthenticationCache","false");			
	    }
	    catch(e)
	    {
		}	

		if(navigator.platform.indexOf("Linux") >= 0 ) {
			try {
				var plugin=document.getElementById("pluginobj");
				plugin.closevpnd();
			}
			catch(e) {
			}
		}
	}

	</script>
	</HEAD>

	<body>
	
    <script type="text/javascript" language="javascript">
	rdx.FRAMEWORK_BASE = "/vpn/js" ;
	rdx.page.add_event_handler(rdx.events.PAGE_LOADED, new rdx.callback(logout, logout.do_action_on_load));
	OnPageLoad();
    </script>
	</body>


</HTML>
