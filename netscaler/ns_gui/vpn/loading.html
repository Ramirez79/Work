<script language="JavaScript">

function redirectBasedOnQueryParam()
{
	var allParams = window.location.search.substr(1).split("&");
	for (var i =0; i < allParams.length; i++)
	{
		var queryParam = allParams[i].split("=")
		if(queryParam[0] == "redirect")
		{
			if(queryParam[1] == "fileshare")
			{
				document.location.replace("/vpns/portal/homepage.html?activetab=fs");
			}
			else
			{
				document.location.replace("/vpns/services.html");
			}
			return
		}
	}
}

function getChromeCookie(choicesCookies)
{
	var i;
	var cookieArray = choicesCookies.split(";");
	for(i=0;i<cookieArray.length;i++)
	{
		var name = cookieArray[i].substr(0,cookieArray[i].indexOf("="));
		var value=cookieArray[i].substr(cookieArray[i].indexOf("=")+1);
		name=name.replace(/^\s+|\s+$/g,"");
		if(name == "NSC_VPNERR")
		{
			return unescape(value);
		}
	}
	return "NoCookie";
}

function detectPluginChrome(choicescookies)
{
	var i;
	var cookieArray = choicescookies.split(";");
	for(i=0;i<cookieArray.length;i++)
	{
		document.cookie = cookieArray[i] + ";path=/; secure";
	}
	
	if( (window.location.search) && (window.location.search.indexOf("redirect=") > -1) )
	{
		return redirectBasedOnQueryParam();
	}

	var vpn_err_cookie_values = getChromeCookie(choicescookies);
	if(vpn_err_cookie_values == "NoCookie")
	{
		document.location.replace("/cgi/setclient?cvpn");
	}
	else
	{
		var cookies = vpn_err_cookie_values.split(",");
		if(cookies[0] != "1")
		{
			document.location.replace("/vpns/choices.html");
		}
		else
		{
			if(cookies[1] == "wicps")
				document.location.replace("/cgi/setclient?wica");
			else if(cookies[1] == "agent")
				document.location.replace("/cgi/setclient?agnt");
			else if(cookies[1] == "cvpn")
				document.location.replace("/cgi/setclient?cvpn");
			else if(cookies[1] == "java")
				document.location.replace("/cgi/setclient?java");
			else if(cookies[1] == "plgn")
				document.location.replace("/cgi/setclient?plugin");
		}
	}
}

var launchError = 0
function setChoicesCookiesChrome()
{
	function launcherExist()
	{
		var redirectURL = window.location.href.split('?')[0];
		
		var allParams = window.location.search.substr(1).split("&");
		for (var i =0; i < allParams.length; i++)
		{
			if(allParams[i].indexOf("tok=") > -1)
			{
				redirectURL = (redirectURL + "?" + allParams[i]);
				break;
			}
		}
		util.getStringFromLauncher("getCookiesString&" + encodeURIComponent(redirectURL) , detectPluginChrome);
	}
	
	function noLauncher()
	{
		if(launchError > 5)
		{
			launchError = 0
			util.launchPlugin(launcherExist, noLauncher);
			return;
		}
		launchError+=1
		document.getElementById("downloadbutton").style.display = '';
		setTimeout("setChoicesCookiesChrome()", 1000);
	}
	
	//launcher gets triggered by VPN plugin. No need of asking browser to launch it
	util.prob("NOP", launcherExist, noLauncher);
}

function setChoicesCookies()
{
	var npagee;
    if ( navigator.platform=="Win64" )
        npagee = navigator.mimeTypes["application/citrix-npagee64"];
    else
        npagee = navigator.mimeTypes["application/citrix-npagee"];

	if(npagee)
	{
        var d = document.getElementById("scriptArea");
        if ( navigator.platform=="Win64" )
            d.innerHTML = '<object id="npobj" type="application/citrix-npagee64" height="1" width="1"></OBJECT>' ;
        else
            d.innerHTML = '<object id="npobj" type="application/citrix-npagee" height="1" width="1"></OBJECT>' ;

        var npobj = document.getElementById("npobj");
        var choicescookies = npobj.GetCookies();
        var cookieArray = choicescookies.split(";");
		
        for(var i=0; i<cookieArray.length; i++) 
		{
        	document.cookie = cookieArray[i] + ";path=/; secure";
        }
		
		if( (window.location.search) && (window.location.search.indexOf("redirect=") > -1) )
		{
			return redirectBasedOnQueryParam();
		}
        redirectToChoices();
    }
	else
	{
        navigator.plugins.refresh(false);
        setTimeout("setChoicesCookies()", 1000);
    }
}

function getVPN_ERRCOOKIEValue(npobj)
{
	var choicesCookies = npobj.GetCookies();
	var cookieArray = choicesCookies.split(";");
	for(i=0;i<cookieArray.length;i++){
		var name = cookieArray[i].substr(0,cookieArray[i].indexOf("="));
		var value=cookieArray[i].substr(cookieArray[i].indexOf("=")+1);
		name=name.replace(/^\s+|\s+$/g,"");
		if(name == "NSC_VPNERR")
		{
			return unescape(value);
		}
	}
	return "NoCookie";
}

function redirectToChoices()
{
	var npobj = document.getElementById("npobj");
	var vpn_err_cookie_values = getVPN_ERRCOOKIEValue(npobj);
	if(vpn_err_cookie_values == "NoCookie")
		document.location.replace("/cgi/setclient?cvpn");
	else
	{
		var cookies = vpn_err_cookie_values.split(",");
		if(cookies[0] != "1")
			document.location.replace("/vpns/choices.html");
		else
		{
			if(cookies[1] == "wicps")
				document.location.replace("/cgi/setclient?wica");
			else if(cookies[1] == "agent")
				document.location.replace("/cgi/setclient?agnt");
			else if(cookies[1] == "cvpn")
				document.location.replace("/cgi/setclient?cvpn");
			else if(cookies[1] == "java")
				document.location.replace("/cgi/setclient?java");
			else if(cookies[1] == "plgn")
				document.location.replace("/cgi/setclient?plugin");
		}
	}
}

function setCookies()
{
    if (navigator.userAgent.indexOf("Windows NT") == -1)
	{
		if (navigator.userAgent.indexOf("Mac OS") >  -1)
		{
				setChoicesCookiesMac();
		}
		return;
    }
	if(util.useLauncher)
	{
		setChoicesCookiesChrome();
	}
	else if( (navigator.userAgent.indexOf("Firefox") > -1) ||  (navigator.userAgent.indexOf("Gecko/2") > -1) || (navigator.userAgent.indexOf("AppleWebKit") > -1 ) )
	{
		setChoicesCookies();
	}
	else
	{
		redirectToChoices();
	}
}

//Mac code
var agmac_portNo = 3148;
var ff_count = 0;
var nscCookie = "";
var redirectUrl = "";
var tokenRec="";
var arrReplace = [];
function setChoicesCookiesMac()
{
       try{
          var npagee;
          npagee = navigator.mimeTypes["application/citrix-agmacplugin"];
          if(npagee) {
             var d = document.getElementById("scriptArea");
             d.innerHTML = '<OBJECT id="npobj" type="application/citrix-agmacplugin" height="1" width="1"></OBJECT>' ;
             var npobj = document.getElementById("npobj");
             var choicescookies = npobj.nsCookies;
             if((choicescookies == undefined) || (!choicescookies) )
             {
               navigator.plugins.refresh(false);
               setTimeout("setChoicesCookiesMac()", 1000);
             }
            else{
              var cookieArray = choicescookies.split(";");
              for(i=0; i<cookieArray.length; i++)
                {
                  document.cookie = cookieArray[i] + ";path=/; secure";
                }
                document.location.replace(npobj.redirectUrl);
              }
        }
        else
        {
            if((navigator.userAgent.indexOf("Chrome") > -1) && (navigator.vendor == "Google Inc."))
            {
                console.log("Handling it without NPAPI");
                getCookie();
            }
          }
       }
       catch(err)
       {
        navigator.plugins.refresh(false);
        setTimeout("setChoicesCookiesMac()", 1000);
       }
}

function nextAgentPort() {
    agmac_portNo = agmac_portNo + 1;
    if( agmac_portNo > 3150 )
    agmac_portNo = 3148;
}

function getCookie()
{
    tokenRec = document.location.search;
    tokenRec = tokenRec.substr(1);
    var image = new Image();
    image.onload = imageLoaded;
    image.onerror = imageError;
    image.src = "http://localhost:"+agmac_portNo+"/cook?"+tokenRec+"?"+nscCookie+"?" +ff_count;
}

function imageLoaded()
{
    if(this.height != 2)
    {
        nscCookie = nscCookie+String.fromCharCode(this.height);
        ff_count = ff_count+1;
        var image = new Image();
        image.onload = imageLoaded;
        image.onerror = imageError;
        image.src = "http://localhost:"+agmac_portNo+"/cook?"+tokenRec+"?"+nscCookie+"?" +ff_count;
    }
    else
    {
        var image = new Image();
        image.onload = imageLoadedUrl;
        image.onerror = imageError;
        image.src = "http://localhost:"+agmac_portNo+"/rurl?"+tokenRec+"?"+redirectUrl+"?" +ff_count;
    }
}

function imageLoadedUrl()
{
    if(this.height != 2)
    {
        if(String.fromCharCode(this.height) != '?')
        {
          redirectUrl = redirectUrl+String.fromCharCode(this.height);
        }
        else {
          redirectUrl = redirectUrl+'/';
          arrReplace.push(redirectUrl.length-1);
        }
        ff_count = ff_count+1;
        var image = new Image();
        image.onload = imageLoadedUrl;
        image.onerror = imageError;
        image.src = "http://localhost:"+agmac_portNo+"/rurl?"+tokenRec+"?"+redirectUrl+"?" +ff_count;
    }
    else
    {
        var cookieArray = nscCookie.split(";");
        for(i=0; i<cookieArray.length; i++) {
          document.cookie = cookieArray[i] + ";path=/; secure";
        }
        //treating replaceUrl to put '?' in proper place
        console.log("redirectUrl = ",redirectUrl);
        redirectUrl = redirectUrl.split('');
        for (var i=0;i<arrReplace.length;i++)
        {
          redirectUrl[arrReplace[i]] = '?';
        }
        redirectUrl = redirectUrl.join('');
        console.log("redirectUrl = ",redirectUrl);
        document.location.replace(redirectUrl);
    }
}

function imageError()
{
    console.log("imageError");
    nextAgentPort();
    getCookie();
}

</script>
