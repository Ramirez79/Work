<script>


var errmsg="N/A";

function makeJSsafe(text) {
    
    // First replacement in this array has to be '&', else we will encode same character multiple times
    var replaceTable =[ 
        {"original" :/&/g , "replacement": '&amp;' }, 
        {"original" :/</g , "replacement": '&lt;' },
        {"original" :/>/g , "replacement": '&gt;' },
        {"original" :/"/g , "replacement": '&quot;' }, 
        {"original" :/'/g , "replacement": '&apos;' }
    ];
        
    for( i= 0; i<replaceTable.length; i++) {
        text = text.replace(replaceTable[i]["original"], replaceTable[i]["replacement"]);
  }
    return text;
}

function GoNextPage()
{
	window.location.replace( "/" );
}

function ns_geterrmsg()
{
   var cookie=document.cookie;
   var errmsg="NSC_ERRM=";
   if(cookie.length > 0) {
        begin=cookie.indexOf(errmsg);
        if(begin!=-1) {
                begin+=errmsg.length;
                end=cookie.indexOf(";", begin);
                if(end==-1) end=cookie.length;
                //As we are assiging this cookie value to innerHTML, we should escape any unsafe character to avoid XSS attack
                return formatError(makeJSsafe( decodeURIComponent(cookie.substring(begin, end)) ), false);
        }
   }
   return "N/A";
}

function ns_cleanerrmsg() {
document.cookie="NSC_ERRM=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/";
}


function ns_fillinfo()
{
  var currentTime = new Date()
  var month = currentTime.getMonth() + 1
  var day = currentTime.getDate()
  var year = currentTime.getFullYear()
  var hour = currentTime.getHours()
  var minute = currentTime.getMinutes()

  var d1 = document.getElementById("dayinfo");
  d1.innerHTML = Resources.FormatShortDate(year, month, day);

  var d2 = document.getElementById("timeinfo");
  d2.innerHTML = Resources.FormatShortTime(hour, minute);

  var d3 = document.getElementById("errmsg");
  d3.innerHTML = ns_geterrmsg();
  
  if (navigator.userAgent.indexOf("Mac OS X") != -1)  //Mac machine
   {
	  document.cookie='NSC_EPAC=nothing;expires=Thursday, 1 Jan 1970 00:00:00 GMT; path=/';
    }

}

</script>
