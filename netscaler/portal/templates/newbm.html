  <script type="text/javascript">
  var text = new Array();
  var link = new Array();
  var HomePageConfig = {};
  $.ajax({
    async: false,
    url:"/cgi/getHomepageConfig",
    type: "get",
    dataType: "json",
    success: function(responseData){
          HomePageConfig = responseData;
      },
    error: function(responseData, textStatus, XMLHttpRequest) {
        console.log("Error in getting HomePage Config");
        },

            <div id="content">

                                                  </tr>
                                                </table>
                                            </td>
                                        </tr>

                                                </table>

                                                  </tr>

                                  <input id="Button_Cancel" type="reset" value="Cancel" onclick="window.close();" tabindex="3" class="Apply_Cancel_OK" />

                                        </tr>
                                    </table>
            <input type="hidden" name="nsc_nonce" id="nsc_nonce" value="[% env.getvar('HTTP_NSC_NONCE') %]" />
