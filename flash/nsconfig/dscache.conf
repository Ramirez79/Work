##################################################################
# Disk cache configuration
# This is default disk cache configuration.
# In case, no disk cache configuration is provided by the user
#  at /nsconfig/dscahe.conf, this default configuration file will
#  be copied to /nsconfig/dscache.conf
#
##################################################################
#
# Disk size in GB (Giga bytes).
#
DISK_SIZE=2048
#
# Disk cache path
# This is the root of the disk cache storage path.
# At this point base directories will created for storing the
# disk cached objects
DISK_PATH="/nscache"
#
# Any addtional configuration.
DE_THR=64		# number of DE worker threads
DE_VERBOSE=2		# larger number, more debugging output

NS_PHYSMEM_MB=`sysctl -n netscaler.hw_physmem_mb`
if [ ! -z "${NS_PHYSMEM_MB}" -a "${NS_PHYSMEM_MB}" -ge 8192 ] ;then
	DE_MAX_DISK_REQUESTS=1024	# num requests per Disk client
else
	DE_MAX_DISK_REQUESTS=256	# num requests per Disk client
fi
